<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Confirm on GBA</title>
    <link rel="stylesheet" href="confirm.css" />
  </head>
  <body>
    <header>
      <div class="logo">[GBA]</div>
      <h1 id="title">Confirm</h1>
    </header>
    <main id="main">
      <p class="muted">Loading...</p>
    </main>
    <footer>
      <p class="hint">
        Look at the GBA screen and press <kbd>A</kbd> to sign or
        <kbd>B</kbd> to cancel.
      </p>
      <button id="btn-cancel" class="danger">Cancel</button>
    </footer>
    <script type="module" src="confirm.ts"></script>
  </body>
</html>
